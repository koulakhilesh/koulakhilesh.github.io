tember until Sunday 11 October, no step-free access to\u002ffrom the eastbound District line. If you are starting an eastbound step-free journey at Earls Court, take a westbound train to Hammersmith and change there for an eastbound train. To complete an eastbound step-free journey at Earls Court: If travelling from Acton Town or Ealing Broadway, use the Piccadilly line from Acton Town. If travelling from Hammersmith, Kew Gardens or Richmond, use the Piccadilly line from Hammersmith. If travelling from Fulham Broadway, Southfields, Wimbledon or Wimbledon Park, take a City-bound District line train and change at Victoria for a westbound train back to Earls Court",91060.0,"51.492063","-0.193378",9],["Lift notice in snapshot",2,"ELEPHANT & CASTLE UNDERGROUND STATION: Until late October, the lifts at the Northern line entrance are out of service for repairs. Please exit and enter the station via the Bakerloo line entrance in London Road.\n\nElephant & Castle: No Step Free Access - Step free access is not available to the southbound Northern line due to faulty lifts. Call us on 0343 222 1234 if you need help planning your journey.",41901.0,"51.494505","-0.099185",9],["Lift notice in snapshot",1,"Harrow & Wealdstone: No Step Free Access - Step free access is not available between the car park entrance (platform 1 - northbound Bakerloo line \u002f Lioness line) and the overbridge. Use Wealdstone High St entrance for step free access to other platforms",5171.0,"51.592216","-0.334896",9],["Lift notice in snapshot",1,"North Greenwich: No Step Free Access - Step free access is not available to the eastbound platform due to a faulty lift. Call us on 0343 222 1234 if you need help planning your journey.",38881.0,"51.500474","0.004295",9],["Lift notice in snapshot",1,"Wembley Central: No Step Free Access - Step free access is not available to the northbound Southern \u002f London Northwestern platform due to a faulty lift. Call us on 0343 222 1234 if you need help planning your j
