<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 120 120" role="img" aria-label="A minimal emblem: Krishna's peacock feather crossed with Arjuna's arrow">
  <defs>
    <radialGradient id="eyeCore" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3a6fb0"/>
      <stop offset="60%" stop-color="#26356b"/>
      <stop offset="100%" stop-color="#1a2450"/>
    </radialGradient>
  </defs>

  <circle cx="60" cy="60" r="56" fill="#f7f2e9" stroke="#e7dcc7" stroke-width="1.5"/>

  <!-- Krishna: peacock feather -->
  <!-- soft vane behind the spine -->
  <path d="M34 96 C46 72 62 50 76 30 C70 52 54 74 40 96 Z" fill="#3f8f8a" fill-opacity="0.16"/>
  <!-- Arjuna: arrow (drawn under the feather spine so they cross) -->
  <path d="M26 28 L88 90" fill="none" stroke="#4a3b2f" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M28 30 L16 22 L23 32 Z" fill="#3f8f8a" stroke="#2f2a6b" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M28 30 L22 16 L31 24 Z" fill="#e79a3a" stroke="#2f2a6b" stroke-width="0.6" stroke-linejoin="round"/>
  <path d="M95 95 L88 80 L80 88 Z" fill="#9aa0aa" stroke="#2f2a6b" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M95 95 L84 84" fill="none" stroke="#5b616c" stroke-width="0.8" stroke-linecap="round"/>

  <!-- feather barbs -->
  <g stroke="#2f8f6d" stroke-width="1.1" stroke-linecap="round" opacity="0.75" fill="none">
    <path d="M42 82 L34 78 M42 82 L49 76"/>
    <path d="M50 70 L42 67 M50 70 L57 64"/>
    <path d="M58 58 L50 56 M58 58 L65 52"/>
    <path d="M66 47 L58 45 M66 47 L72 41"/>
  </g>
  <!-- spine -->
  <path d="M34 96 C44 74 60 50 76 30" fill="none" stroke="#1f6b57" stroke-width="1.7" stroke-linecap="round"/>

  <!-- ocellus (the eye) -->
  <g transform="translate(80 24) rotate(28)">
    <ellipse rx="9.5" ry="12.5" fill="#2f8f6d"/>
    <ellipse rx="6.6" ry="9" fill="#e6a93b"/>
    <ellipse rx="4" ry="6" fill="url(#eyeCore)"/>
    <circle cx="-1.3" cy="-2.4" r="1.5" fill="#9fdcea"/>
  </g>
</svg>


