# Site
title: "Akhilesh Koul"
tagline: "Tech, tinkering & tales."
description: "Akhilesh Koul, a data scientist and maker. Projects, writing, and DIY."
url: "https://koulakhilesh.github.io"
baseurl: ""
lang: en-US
logo: "/assets/images/logo.png"
author:
  name: "Akhilesh Koul"
  role: "Data Scientist · Maker · London"
  email: "koulakhilesh@gmail.com"
  github: "koulakhilesh"
  linkedin: "akhilesh-koul"

# Shown at the foot of every post (set `ai_disclaimer: false` in a post's
# front matter to hide it there). Markdown is allowed.
ai_disclaimer: >-
  **How this was made.** The data is public and belongs to its sources (see
  the method note in each post); I use it for personal, non-commercial
  analysis. The code, analysis and writing were done with the help of a
  generative-AI assistant, working to my direction. I checked the results and
  the numbers against the source data. Any mistakes are mine.

# Build
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
permalink: /writing/:title/
sass:
  style: compressed
  sass_dir: _sass
timezone: Europe/London

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  making:
    output: true
    permalink: /making/:name/

# Defaults
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "", type: "making" }
    values: { layout: "making" }

# "Now" line on the homepage. Leave empty to show a placeholder.
now:
  - Working on an Agentic LifeOS
  - Reading The Unbearable Lightness of Being
#  - Working on a side project
#  - Learning something new
#  - Reading a good book

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - package.json
  - vendor
  - .superpowers
  - docs
  - scripts