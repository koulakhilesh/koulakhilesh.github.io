# Site
title: "Akhilesh Koul"
tagline: "Tech, tinkering & tales."
description: "Akhilesh Koul, a data scientist and maker. Projects, writing, and DIY."
url: "https://koulakhilesh.github.io"
baseurl: ""
lang: en-US
logo: "/assets/images/logo.png"
author:
  name: "Akhilesh Koul"
  role: "Data Scientist · Maker · London"
  email: "koulakhilesh@gmail.com"
  github: "koulakhilesh"
  linkedin: "akhilesh-koul"

# Shown at the foot of every post (set `ai_disclaimer: false` in a post's
# front matter to hide it there). Markdown is allowed.
ai_disclaimer: >-
  **On how this was made.** The underlying data is public and belongs to its
  original sources — see the method/licence note in each post — and is used
  here for personal, non-commercial analysis; it isn't mine. The code,
  analysis, and writing were produced with the help of a generative-AI
  assistant, working from my direction; I reviewed the results and checked the
  figures against the source data. Any errors are mine.

# Build
markdown: kramdown
kramdown:
  input: GFM
highlighter: rouge
permalink: /writing/:title/
sass:
  style: compressed
  sass_dir: _sass
timezone: Europe/London

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/
  making:
    output: true
    permalink: /making/:name/

# Defaults
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }
  - scope: { path: "", type: "projects" }
    values: { layout: "project" }
  - scope: { path: "", type: "making" }
    values: { layout: "making" }

# Homepage tuning
home:
  featured_posts: 3
  featured_projects: 2
  making_preview: 4

# "// Now" card on the homepage. Leave empty to show a placeholder.
now:
  - Building The Gita Project, a verse-by-verse study of the Bhagavad Gita
  - Working on an Agentic LifeOS
#  - Working on a side project
#  - Learning something new
#  - Reading a good book

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules
  - package.json
  - vendor
  - .superpowers
  - docs